name: ci

# Four gates, one job each.  Every command below is also in AGENTS.md; keep the
# two in sync — the agent guide is what a contributor reads before opening a PR,
# and a gate that only exists here is a gate nobody runs locally.
#
# The toolchain is not hard-coded: each job reads the pin out of
# rust-toolchain.toml, so bumping the nightly is a one-line change in that file.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal \
            --component rust-src --component llvm-tools \
            --target riscv64gc-unknown-none-elf
      - name: Build the kernel
        run: |
          set -euo pipefail
          if [ "${{ matrix.profile }}" = release ]; then
            cargo build --release --locked
          else
            cargo build --locked
          fi
      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: pagh-riscv64-${{ matrix.profile }}
          path: target/riscv64gc-unknown-none-elf/${{ matrix.profile }}/pagh
          if-no-files-found: error

  smoke:
    name: QEMU boot + shell smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal \
            --target riscv64gc-unknown-none-elf
      - name: Install QEMU
        run: |
          set -euo pipefail
          sudo apt-get update
          # The target lives in different packages across runner images
          # (qemu-system-misc on some, a split qemu-system-riscv on others), and a
          # missing binary used to fail here with exit 127 and no explanation.
          # qemu-img lives in qemu-utils, not in the qemu-system packages: the
          # disk-acceptance steps create the image with it (exit 127 otherwise).
          for pkg in qemu-system-misc qemu-system-riscv qemu-system qemu-system-data qemu-utils; do
            sudo apt-get install -y --no-install-recommends "$pkg" || true
          done
          command -v qemu-img || {
            echo "qemu-img is missing (the disk acceptance needs qemu-utils)"
            exit 1
          }
          command -v qemu-system-riscv64 || {
            echo "qemu-system-riscv64 is still missing; packages that mention it:"
            apt-cache search qemu-system | head -20
            exit 1
          }
          qemu-system-riscv64 --version
          # Firmware: prefer the image QEMU ships with, fall back to the OpenSBI
          # file distributions install for it.
          for fw in /usr/share/qemu/opensbi-riscv64-generic-fw_dynamic.bin \
                    /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin; do
            if [ -f "$fw" ]; then
              echo "PAGH_BIOS=$fw" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Build the debug kernel
        run: cargo build --locked
      - name: Boot it and drive the shell (serial console)
        run: python3 .github/smoke.py target/riscv64gc-unknown-none-elf/debug/pagh
      - name: Boot it with ramfb (the screen path)
        run: python3 .github/smoke.py target/riscv64gc-unknown-none-elf/debug/pagh --ramfb
      # M7 acceptance: a virtio-net NIC on QEMU's user network, DHCP lease at
      # boot, then `net` and an ICMP echo to the gateway. Deterministic: the
      # network is QEMU's own slirp, not the runner's internet access.
      - name: Boot it with a virtio-net NIC (DHCP + ping)
        run: python3 .github/smoke.py target/riscv64gc-unknown-none-elf/debug/pagh --net
      # M5 acceptance, end to end: a blank virtio-mmio image is formatted by the
      # kernel, mounted at /mnt and written to; the second run boots the very same
      # image and must mount it (no reformat) and read the marker file back. Two
      # runs, because persistence across a reboot is the claim.
      - name: Create a blank disk image
        run: qemu-img create -f raw /tmp/pagh-ci.img 64M
      - name: Format and mount a blank disk (virtio-mmio + ext2)
        run: >-
          python3 .github/smoke.py target/riscv64gc-unknown-none-elf/debug/pagh
          --ramfb --disk /tmp/pagh-ci.img --fresh
      - name: Remount the same disk and read the file back
        run: >-
          python3 .github/smoke.py target/riscv64gc-unknown-none-elf/debug/pagh
          --ramfb --disk /tmp/pagh-ci.img