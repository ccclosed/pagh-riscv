[package]
name = "pagh"
version = "0.19.0"
edition = "2021"
description = "pagh OS — a 64-bit RISC-V (RV64) kernel in Rust"
license = "MIT"

[dependencies]

# ── HTTPS / TLS 1.3 (fail-closed server authentication, 0.19.0) ──
# `embedded-tls` is the maintained no_std Rust TLS 1.3 implementation. Pinned
# exactly; `default-features = false` drops its `std`/`log`/`tokio` defaults and
# `alloc` routes its heap use through the kernel's global allocator. It pulls a
# no_std crypto stack (sha2/hmac/hkdf/aes-gcm/p256/ecdsa/rand_core).
#
# SECURITY: the crate's `UnsecureProvider`/`NoVerify` path is NOT used. The
# handshake runs `net::tls::KernelProvider`, whose `verifier()` always returns
# the kernel verifier — chain validation to `net::ca_bundle`, SAN hostname
# authorization, validity + clock gate and `CertificateVerify` are mandatory.
#
# This pin carries ONE deliberate local patch, ported from the x86-64 sibling:
# upstream accepted a server `Finished` that was not preceded by
# `Certificate`/`CertificateVerify`, so a peer could reach `ApplicationData`
# with the verifier never invoked. The patched `connection.rs` enforces the
# RFC 8446 §4.4.2.4 ordering; any refresh of this crate must re-apply it and
# update `.cargo-checksum.json`.
embedded-tls = { version = "=0.19.0", default-features = false, features = ["alloc"] }
# Sync + async byte-IO traits the TLS transport adapter implements. Pinned to
# the versions `embedded-tls` itself depends on so cargo unifies one copy.
embedded-io = { version = "=0.7.1", default-features = false }
embedded-io-async = { version = "=0.7.0", default-features = false }
# `rand_core` (0.6) traits (`RngCore` + `CryptoRng`) required of the handshake
# RNG; `net::tls::KernelRng` implements them over the kernel's entropy source.
# WEAK: that source is not a hardware CSPRNG — see `src/net/tls.rs` and
# `SECURITY.md` for the honest statement of what it does and does not protect.
rand_core = { version = "=0.6.4", default-features = false }
# ── X.509 certificate signature verification ──
# Pure-Rust verify-only backends for the chain verifier (`src/net/tls_verify.rs`
# dispatches on the certificate's AlgorithmIdentifier OID). All no_std + alloc,
# pinned exactly, `default-features = false` (no std, no RNG features — the
# verifier never generates keys).
# - `rsa` 0.9: RSASSA-PKCS1-v1_5 verify over sha2 (sha256/384/512WithRSA OIDs).
# - `p384` 0.13: ECDSA P-384 (secp384r1) verify.
# - `ed25519-dalek` 2.2: Ed25519 verify (RFC 8410 certs).
rsa = { version = "=0.9.9", default-features = false, features = ["sha2"] }
p384 = { version = "=0.13.0", default-features = false, features = ["ecdsa", "sha384"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast"] }
# `sha2`/`p256` are used directly by `tls_verify.rs` (PKCS1-v1_5 digest inputs,
# P-256 ECDSA verify) and `signature` provides the `Verifier` trait across all
# backends. The `oid` feature gives the sha2 digests their `AssociatedOid`
# impls, which rsa's DigestInfo-prefixed PKCS1-v1_5 verifier requires.
sha2 = { version = "=0.10.9", default-features = false, features = ["oid"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
signature = { version = "=2.2.0", default-features = false }
const-oid = { version = "=0.9.6", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
